[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ats"
version = "0.1.0"
description = "Ask the Sensors -- grounded, explainable activity question answering from wearable signals (CS60055 Hackathon Challenge 1)"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0",
    "numpy>=1.24",
    "torch>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The SLM question parser (ats/slm.py); the rule router needs none of this.
slm = ["transformers>=4.44,<5"]

[tool.setuptools.packages.find]
include = ["ats*"]
